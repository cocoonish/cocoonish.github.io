# Astro sitesini derleyip GitHub Pages'e yayınlar.
# Tetik: main'e her push + elle çalıştırma.
name: Yayınla (GitHub Pages)

on:
  push:
    branches: [main]
  # YEDEK DERLEMELER (pazar akşamı). 30.08.2026'da bir içerik push'unun
  # derlemesi düştü (şema geçişi); sonraki push kendini onardı ama pazar
  # akşamı İÇERİK SEYREK — haftalık bülten + teknik analiz yazıldıktan sonra
  # başka push gelmeyebilir ve düşen tek derleme siteyi ertesi sabaha kadar
  # eski bırakır. Bu koşular en son main'i yeniden derler; içerik aynıysa
  # aynı siteyi yayınlar, maliyeti yok. Saatler rutinin (17:45 TR) işini
  # bitirmesinden sonraya konuldu.
  schedule:
    - cron: '35 15 * * 0'   # 18:35 İstanbul
    - cron: '5 17 * * 0'    # 20:05 İstanbul
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın; devam eden bir yayını iptal ETME (yarım site yayınlanmasın).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # YIĞIN SINIRI. 02.09.2026'da kaynak deponun yayın kapısında derleme
      # "JavaScript heap out of memory" ile düştü (2.030 MB'ta abort): Node
      # varsayılan yığını makinenin belleğine göre seçiyor ve koşucuda ~2 GB'ta
      # duruyor. Aynı kaynak burada da derleniyor, yani aynı duvar buraya da
      # çıkar. Koşucunun 16 GB'ı var; 6 GB bugünkü ihtiyacın kat kat üstünde,
      # gerçek bir sızıntıda hâlâ düşecek kadar dar.
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - id: dagit
        uses: actions/deploy-pages@v4
