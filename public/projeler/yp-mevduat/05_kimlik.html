fb\u003e\u003cbr\u003e\u003csup\u003eKaynak hem stok seviyesini hem de haftal\u0131k de\u011fi\u015fimin iki par\u00e7as\u0131n\u0131 yay\u0131ml\u0131yor. \u00dcstteki panelde y\u0131\u011f\u0131l\u0131 \u00e7ubuklar\u0131n toplam\u0131, kesikli izle \u00e7izilen stok\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003ede\u011fi\u015fimini kapatmal\u0131d\u0131r; alttaki panel aradaki fark\u0131 g\u00f6sterir.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eResm\u00ee ayr\u0131\u015ft\u0131rma stok de\u011fi\u015fimini kapat\u0131yor. \u00d6l\u00e7\u00fclen pencerede resm\u00ee ayr\u0131\u015ft\u0131rma ile stok de\u011fi\u015fimi aras\u0131ndaki en b\u00fcy\u00fck fark 5,8 milyon dolar. \u00d6l\u00e7\u00fcm\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003epenceresi son 52 hafta; tolerans, o haftan\u0131n br\u00fct hareketinin %1 kadar\u0131 ya da 25,0 milyon dolar \u2014 hangisi b\u00fcy\u00fckse.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eArt\u0131\u011f\u0131n son haftadaki de\u011feri toplamda 0,1, ger\u00e7ek ki\u015filerde 0,0, t\u00fczel ki\u015filerde 0,0 milyon dolar. Gri kesikli izler tolerans\u0131n iki y\u00f6n\u00fcn\u00fc g\u00f6steriyor.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eBu \u015fekil iki tablodan birden besleniyor ve tarihi, ikisinin en eski olan\u0131na ba\u011fl\u0131d\u0131r: bir k\u0131yas ancak her iki taraf\u0131n da \u00f6l\u00e7\u00fcld\u00fc\u011f\u00fc g\u00fcne kadar\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003ekurulabilir. Ayn\u0131 sebeple \u015fekil yaln\u0131z iki tablonun ORTAK haftalar\u0131n\u0131 \u00e7iziyor; de\u011fi\u015fim tablosunun tek ba\u015f\u0131na uzand\u0131\u011f\u0131 daha eski d\u00f6nemde kimlik\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003es\u0131nanamaz ve o d\u00f6nem burada g\u00f6sterilmez.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eKaynak: TCMB EVDS3, haftal\u0131k para ve banka istatistikleri \u00b7 TP.HPBITABLO2, TP.HPBITABLO4 ve TP.HPBITABLO5 tablolar\u0131\u003c\u002fsup\u         var ad = k.replace('axis', 'axis'); // layout anahtarı aynı
        guncelle[ad + '.tickmode'] = 'auto';
        guncelle[ad + '.nticks'] = 14;
        guncelle[ad + '.tickangle'] = -40;
      }
    });
    var bas = (gd.layout.title && gd.layout.title.text) || '';
    var ustBaslik = (gd.layout.annotations || []).some(function (a) {
      return a.yanchor === 'bottom' && a.yref === 'paper' && a.y >= 0.98;
    });
    var altSatir = (bas.match(/<br>/g) || []).length;
    var gerekenT = 92 + 26 * altSatir + (ustBaslik ? 26 : 0);
    if (ustBaslik && altSatir && (gd.layout.margin || {}).t < gerekenT) {
      guncelle['margin.t'] = gerekenT;
    }
    Plotly.relayout(gd, guncelle);
    window.addEventListener('resize', function () { Plotly.Plots.resize(gd); });
    Plotly.Plots.resize(gd);
  }
  if (document.readyState === 'complete') uygula();
  else window.addEventListener('load', uygula);
})();
</script>
