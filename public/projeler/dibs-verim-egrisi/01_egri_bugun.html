u0131f\u0131r kuponlu) verim e\u011frisi\u003c\u002fb\u003e\u003cbr\u003e\u003csup\u003eVeri: TCMB EVDS3 \u00b7 D\u0130BS g\u00f6sterge de\u011ferleri \u00b7 \u00c7\u0131pa: 3 Eyl\u00fcl 2026. E\u011fri 188 s\u0131f\u0131r kuponlu strip'ten kuruluyor; vade aral\u0131\u011f\u0131\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003e0,09\u20139,01 y\u0131l.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eBOOTSTRAP YOK: TCMB her sabit kuponlu D\u0130BS'in anapara ve kupon strip'lerini ayr\u0131 yay\u0131ml\u0131yor; strip s\u0131f\u0131r kuponlu oldu\u011fu i\u00e7in spot\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003egetiri do\u011frudan okunuyor \u2014 y = (\u00f6deme\u002ffiyat)^(365\u002fkalan g\u00fcn) \u2212 1, ACT\u002f365 y\u0131ll\u0131k bile\u015fik.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003e\u00d6deme: anapara strip'inde 100 TL; kupon strip'inde o serinin kendi \u003ci\u003e.ORAN\u003c\u002fi\u003e de\u011feri. \u003ci\u003e.ORAN\u003c\u002fi\u003e ad\u0131 'Kupon Faiz Oran\u0131' olsa da i\u00e7erik\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eD\u00d6NEMSEL KUPON TUTARIDIR, y\u0131ll\u0131k oran de\u011fildir.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eKimlik denetimi: ayn\u0131 itfa g\u00fcn\u00fcne d\u00fc\u015fen ba\u011f\u0131ms\u0131z strip'ler ayn\u0131 getiriyi vermeli. \u00c7\u0131pa g\u00fcn\u00fcnde 51 vadede \u00e7oklu kaynak var, medyan\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003esapma 0,0044 puan (e\u015fik 0,15).\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eAra de\u011fer do\u011frusald\u0131r ve EKSTRAPOLASYON YAPMAZ; iki kom\u015fu nokta aras\u0131ndaki bo\u015fluk vadeye g\u00f6re belirlenen s\u0131n\u0131r\u0131 a\u015farsa o d\u00fc\u011f\u00fcm BO\u015e\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eb\u0131rak\u0131l\u0131r \u2014 grafikte \u00e7izgi de orada kesilir.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eDe\u011fi\u015fken faizli s\u0131zmas\u0131na kar\u015f\u0131 0 kupon strip'i \u00f6deme tutar\u         guncelle[k + '.tickfont.color'] = '#6b6355';
        guncelle[k + '.title.font.size'] = 12;
        guncelle[k + '.title.font.color'] = '#211b12';
        guncelle[k + '.automargin'] = true;
      }
    });
    // kalabalık kategori eksenlerinde tik seyreltme — her etiketi basmak
    // grafiği okunmaz yapar; ~14 tikte tut, hafif eğ
    var fl = gd._fullLayout || {};
    Object.keys(fl).forEach(function (k) {
      if (/^xaxis\d*$/.test(k) && fl[k] && fl[k]._categories &&
          fl[k]._categories.length > 24) {
        var ad = k.replace('axis', 'axis'); // layout anahtarı aynı
        guncelle[ad + '.tickmode'] = 'auto';
        guncelle[ad + '.nticks'] = 14;
        guncelle[ad + '.tickangle'] = -40;
      }
    });
    var bas = (gd.layout.title && gd.layout.title.text) || '';
    var ustBaslik = (gd.layout.annotations || []).some(function (a) {
      return a.yanchor === 'bottom' && a.yref === 'paper' && a.y >= 0.98;
    });
    var altSatir = (bas.match(/<br>/g) || []).length;
    var gerekenT = 92 + 26 * altSatir + (ustBaslik ? 26 : 0);
    if (ustBaslik && altSatir && (gd.layout.margin || {}).t < gerekenT) {
      guncelle['margin.t'] = gerekenT;
    }
    Plotly.relayout(gd, guncelle);
    window.addEventListener('resize', function () { Plotly.Plots.resize(gd); });
    Plotly.Plots.resize(gd);
  }
  if (document.readyState === 'complete') uygula();
  else window.addEventListener('load', uygula);
})();
</script>
