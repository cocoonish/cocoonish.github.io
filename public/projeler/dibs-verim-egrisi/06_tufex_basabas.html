"\u003cb\u003e29,19%\u003c\u002fb\u003e","x":"2026-08-25T00:00:00","xanchor":"left","xref":"x3","xshift":8,"y":29.189198,"yref":"y3","yshift":0}],"shapes":[{"line":{"color":"#1a1a1a","width":0.8},"type":"line","x0":0,"x1":1,"xref":"x domain","y0":0,"y1":0,"yref":"y"}],"title":{"pad":{"t":104,"l":0},"font":{"size":15,"color":"#1a1a1a","family":"Georgia, serif"},"text":"\u003cb\u003eT\u00dcFEX reel e\u011frisi ve ba\u015faba\u015f enflasyon\u003c\u002fb\u003e\u003cbr\u003e\u003csup\u003eVeri: TCMB EVDS3 \u00b7 \u00c7\u0131pa: 25 A\u011fustos 2026. Reel getiri = (100 \u00d7 RefEndeks(t)\u002fRefEndeks(ihra\u00e7) \u00f7 fiyat)^(365\u002fg\u00fcn) \u2212 1. T\u00dcFEX'in\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eyay\u0131mlanan 'De\u011fer'i ENDEKSLENM\u0130\u015e TL fiyat\u0131d\u0131r, reel fiyat de\u011fildir.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eReferans endeks EVDS'te YOK; Hazine'nin tan\u0131m\u0131 yeniden kuruluyor: RefEndeks(t) = T\u00dcFE(m\u22123) + (g\u00fcn\u22121)\u002fD \u00d7 [T\u00dcFE(m\u22122) \u2212 T\u00dcFE(m\u22123)].\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eTaban 2003=100 zinciridir; T\u00dc\u0130K 2025 baz de\u011fi\u015fikli\u011fi sonras\u0131 zincir katsay\u0131s\u0131 \u00f6rt\u00fc\u015fme ay\u0131ndan (2026-01-01) her ko\u015fuda okunur:\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003e31,8312 \u2014 sabit yaz\u0131lmaz.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eBA\u015eABA\u015e \u2260 BEKLENT\u0130. Panel (b)'de DOLU baklavalar anketin s\u00f6yledi\u011fi, k\u0131rm\u0131z\u0131 \u00e7izgi piyasan\u0131n fiyatlad\u0131\u011f\u0131 enflasyondur. Aradaki fark\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eenflasyon risk primi, likidite primi ve T\u00dcFE \u00f6l\u00e7\u00fcm\u00fcne g\u00fcvensizli\u011fin kar\u0131\u015f\u0131m\u0131d\u0131r: 1 y\u0131lda 3,7 puan, 5 y\u0131lda 14,4 puan.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eUFUK D\u00dcZELTMES\u0130: PKA serileri 'X AY SONRASININ y\u0131ll\u0131k T\u00dcFE' oranlar\u0131d\u0131r \u2014 24 ay serisi \u0130K\u0130NC\u0130 YILIN tek y\u0131ll\u0131k oran\u0131d\u0131r, iki\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003ey\u0131ll\u0131k ortalama DE\u011e\u0130L. Ba\u015faba\u015f ise tan\u0131m\u0131 gere\u011fi vadeye kadarki y\u0131ll\u0131k ORTALAMA'd\u0131r. Dolu baklavalar bu y\u00fczden 12 ay, 24 ay ve 5\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003ey\u0131l \u00e7\u0131palar\u0131ndan kurulan bir y\u0131ll\u0131k enflasyon patikas\u0131n\u0131n vadeye kadarki GEOMETR\u0130K ORTALAMASIDIR; i\u00e7i bo\u015f gri baklavalar ham nokta\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003ebeklentilerdir. Ara y\u0131llar (3, 4) log-do\u011frusal ara de\u011ferle doldurulur ve son \u00e7\u0131pan\u0131n \u00f6tesi (6, 7) sabit tutulur \u2014 patika bir\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eVARSAYIMDIR, anket o y\u0131llar\u0131 sormaz.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eReel e\u011fri nominal e\u011fri kadar s\u0131k de\u011fildir: T\u00dcFEX evreni 20 anapara strip'i; reel d\u00fc\u011f\u00fcmler nominal d\u00fc\u011f\u00fcmler kadar s\u0131k kurulamaz ve\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003evade bo\u015flu\u011fu geni\u015f olan d\u00fc\u011f\u00fcm o g\u00fcn BO\u015e b\u0131rak\u0131l\u0131r (uydurulmu\u015f ara de\u011fer bas\u0131lmaz).\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eK\u0131sa u\u00e7ta k\u0131ymetler aras\u0131 sa\u00e7\u0131lma geni\u015ftir (\u015eekil 08c); tek bir 'reel faiz' \u00e7izgisine indirgemek yanl\u0131\u015f kesinlik \u00fcretir. Uzun u\u00e7ta\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003esa\u00e7\u0131lma daral\u0131r.\u003c\u002fsup\u003e","x":0,"xanchor":"left","y":1.0,"yanchor":"top","yref":"container"},"font":{"family":"Georgia, serif","size":12,"color":"#1a1a1a"},"legend":{"font":{"size":11},"orientation":"h","yanchor":"top","y":-0.1,"x":0,"tracegroupgap":2,"bgcolor":"rgba(255,255,255,0)"},"margin":{"l":64,"r":64,"t":533       plot_bgcolor: '#ffffff',
      'title.x': 0.01,
      'title.xanchor': 'left',
      'title.font.size': 15,
      'title.font.color': '#211b12',
      // lejant her zaman grafiğin ALTINDA — başlıkla çakışma imkânsız
      'legend.orientation': 'h',
      'legend.yanchor': 'top',
      'legend.y': -0.1,
      'legend.xanchor': 'left',
      'legend.x': 0,
      'legend.font.size': 11,
      'legend.bgcolor': 'rgba(255,255,255,0)',
      'margin.t': mevcut ? 92 : 36,
      'margin.r': 64,
      'margin.b': 110,
      'margin.l': 64,
      'hoverlabel.bgcolor': '#211b12',
      'hoverlabel.bordercolor': '#211b12',
      'hoverlabel.font.color': '#f5f0e6',
      'hoverlabel.font.size': 12
    };
    // otomatik renk ataması alan izler için ev paleti (açıkça renklendirilmiş
    // izler etkilenmez)
    guncelle['colorway'] = ['#1d5c5c', '#8e1f2f', '#9a7327', '#2f4b7c',
                           '#665191', '#a05195', '#d45087', '#7a9e7e'];
    // tüm eksenlere (subplot dahil) uyumlu ızgara/kenar/yazı stili
    Object.keys(gd.layout).forEach(function (k) {
      if (/^[xy]axis\d*$/.test(k)) {
        guncelle[k + '.gridcolor'] = '#efe9dc';
        guncelle[k + '.zerolinecolor'] = '#cfc4ab';
        guncelle[k + '.linecolor'] = '#d8cfba';
        guncelle[k + '.tickfont.size'] = 11;
        guncelle[k + '.tickfont.color'] = '#6b6355';
        guncelle[k + '.title.font.size'] = 12;
        guncelle[k + '.title.font.color'] = '#211b12';
        guncelle[k + '.automargin'] = true;
      }
    });
    // kalabalık kategori eksenlerinde tik seyreltme — her etiketi basmak
    // grafiği okunmaz yapar; ~14 tikte tut, hafif eğ
    var fl = gd._fullLayout || {};
    Object.keys(fl).forEach(function (k) {
      if (/^xaxis\d*$/.test(k) && fl[k] && fl[k]._categories &&
          fl[k]._categories.length > 24) {
        var ad = k.replace('axis', 'axis'); // layout anahtarı aynı
        guncelle[ad + '.tickmode'] = 'auto';
        guncelle[ad + '.nticks'] = 14;
        guncelle[ad + '.tickangle'] = -40;
      }
    });
    var bas = (gd.layout.title && gd.layout.title.text) || '';
    var ustBaslik = (gd.layout.annotations || []).some(function (a) {
      return a.yanchor === 'bottom' && a.yref === 'paper' && a.y >= 0.98;
    });
    var altSatir = (bas.match(/<br>/g) || []).length;
    var gerekenT = 92 + 26 * altSatir + (ustBaslik ? 26 : 0);
    if (ustBaslik && altSatir && (gd.layout.margin || {}).t < gerekenT) {
      guncelle['margin.t'] = gerekenT;
    }
    Plotly.relayout(gd, guncelle);
    window.addEventListener('resize', function () { Plotly.Plots.resize(gd); });
    Plotly.Plots.resize(gd);
  }
  if (document.readyState === 'complete') uygula();
  else window.addEventListener('load', uygula);
})();
</script>
