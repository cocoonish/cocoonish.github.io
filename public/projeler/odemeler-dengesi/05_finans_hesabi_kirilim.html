002fsup\u003e\u003cbr\u003e\u003csup\u003e0,00 mn USD).\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eADLANDIRMA: BPM6'da bu kalemlerin hepsi NET y\u00fck\u00fcml\u00fcl\u00fck olu\u015fumudur (Q38'in EVDS'teki ad\u0131 bile '3.6.Finansal T\u00fcrevler: NET Y\u00fck\u00fcml\u00fcl\u00fck\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eOlu\u015fumu') ve negatif olabilirler. 'Br\u00fct' demek yaln\u0131z giri\u015flerin say\u0131ld\u0131\u011f\u0131 izlenimini verirdi \u2014 vermez.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003e\u00d6l\u00e7\u00fclen (12 ayl\u0131k, Haziran 2026): y\u00fck\u00fcml\u00fcl\u00fck olu\u015fumu (net, t\u00fcrevler d\u00e2hil) 66,7 mia USD \u2014 t\u00fcrev baca\u011f\u0131 -20,6 mia USD oldu\u011fu i\u00e7in t\u00fcrevsiz\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003es\u00fcr\u00fcm 87,3 mia USD. Yerle\u015fik varl\u0131k edinimi 34,3 mia USD, net giri\u015f 32,4 mia USD.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eYI\u011eININ TOPLAMI \u00c7\u0130ZG\u0130YE E\u015e\u0130TT\u0130R \u2014 HER KO\u015eUDA \u00d6L\u00c7\u00dcL\u00dcR. \u00c7ubuklar\u0131n toplam\u0131 ile toplam \u00e7izgisi aras\u0131ndaki en b\u00fcy\u00fck fark grafik katman\u0131nda\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eayr\u0131ca s\u0131nan\u0131r (cikti\u002fyigin_denetimi.json); ayr\u0131\u015fma olursa hat durur ve siteye kopyalama yap\u0131lmaz.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eREZERV NEDEN AYRI: analitik sunumda rezerv varl\u0131klar finans hesab\u0131n\u0131n \u0130\u00c7\u0130NDE DE\u011e\u0130LD\u0130R (ayr\u0131nt\u0131l\u0131 sunumun Q101'i i\u00e7erir; k\u00f6pr\u00fc Q101 = Q13 +\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eQ33). \u0130kisini ayn\u0131 etiketle yan yana koymak 2026-03'te 43,4 milyar USD'lik sahte bir sapma \u00fcretiyordu.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eFinansal t\u00fcrevler kalemi 2014-01'de BA\u015eLIYOR; \u00f6ncesinde kalem YOK (s\u0131f\u0131r de\u011fil) ve y\u0131\u011f
