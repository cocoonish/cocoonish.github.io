br\u003e\u003csup\u003ekalemidir (TP.ODANA6.Q13).\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003e\u0130\u015eARET: BPM6'da finans hesab\u0131 = net varl\u0131k edinimi \u2212 net y\u00fck\u00fcml\u00fcl\u00fck olu\u015fumu ve POZ\u0130T\u0130F de\u011fer sermaye \u00c7IKI\u015eI demektir. Burada okuma kolayl\u0131\u011f\u0131\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003ei\u00e7in G\u0130R\u0130\u015e i\u015fareti kullan\u0131ld\u0131; \u00e7evirme metrik katman\u0131nda TEK YERDE yap\u0131l\u0131r.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eY\u0131\u011f\u0131n kimliktir: yabanc\u0131n\u0131n net y\u00fck\u00fcml\u00fcl\u00fck olu\u015fumu eksi yerle\u015fiklerin d\u0131\u015f varl\u0131k edinimi = net finansman giri\u015fi (s\u0131nand\u0131, en b\u00fcy\u00fck sapma\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003e0,00 mn USD).\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eADLANDIRMA: BPM6'da bu kalemlerin hepsi NET y\u00fck\u00fcml\u00fcl\u00fck olu\u015fumudur (Q38'in EVDS'teki ad\u0131 bile '3.6.Finansal T\u00fcrevler: NET Y\u00fck\u00fcml\u00fcl\u00fck\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eOlu\u015fumu') ve negatif olabilirler. 'Br\u00fct' demek yaln\u0131z giri\u015flerin say\u0131ld\u0131\u011f\u0131 izlenimini verirdi \u2014 vermez.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003e\u00d6l\u00e7\u00fclen (12 ayl\u0131k, Temmuz 2026): y\u00fck\u00fcml\u00fcl\u00fck olu\u015fumu (net, t\u00fcrevler d\u00e2hil) 66,9 mia USD \u2014 t\u00fcrev baca\u011f\u0131 -20,9 mia USD oldu\u011fu i\u00e7in t\u00fcrevsiz\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003es\u00fcr\u00fcm 87,7 mia USD. Yerle\u015fik varl\u0131k edinimi 37,5 mia USD, net giri\u015f 29,4 mia USD.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eYI\u011eININ TOPLAMI \u00c7\u0130ZG\u0130YE E\u015e\u0130TT\u0130R \u2014 HER KO\u015eUDA \u00d6L\u00c7\u00dcL\u00dcR. \u00c7ubuklar\u0131n toplam\u0131 ile toplam \u00e7izgisi aras\u0131ndaki en b\u00fcy\u00fck fark grafik katman\u0131nda\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eayr\u0131ca s\u0131nan\u0131r (cikti\u002fyigin_denetimi.json); ayr\u0131\u015fma olursa hat durur ve siteye kopyalama yap\u0131lmaz.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eREZERV NEDEN AYRI: analitik sunumda rezerv varl\u0131klar finans hesab\u0131n\u0131n \u0130\u00c7\u0130NDE DE\u011e\u0130LD\u0130R (ayr\u0131nt\u0131l\u0131 sunumun Q101'i i\u00e7erir; k\u00f6pr\u00fc Q101 = Q13 +\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eQ33). \u0130kisini ayn\u0131 etiketle yan yana koymak 2026-03'te 43,4 milyar USD'lik sahte bir sapma \u00fcretiyordu.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eFinansal t\u00fcrevler kalemi 2014-01'de BA\u015eLIYOR; \u00f6ncesinde kalem YOK (s\u0131f\u0131r de\u011fil) ve y\u0131\u011f\u0131nda g\u00f6r\u00fcnmez.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eY\u0131\u011f\u0131lm\u0131\u015f \u00e7ubuklar okunabilirlik i\u00e7in 3 AYDA B\u0130R \u00f6rneklendi (12 ayl\u0131k birikimli seride ard\u0131\u015f\u0131k iki \u00e7ubuk 11 ay\u0131 ortak ta\u015f\u0131r); \u00e7izgiler ayl\u0131k,\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003ehi\u00e7bir tepe noktas\u0131 atlanm\u0131yor.\u003c\u002fsup\u003e","x":0,"xanchor":"left","y":1.0,"yanchor":"top","yref":"container"},"font":{"family":"Georgia, serif","size":12,"color":"#1a1a1a"},"legend":{"font":{"size":11},"orientation":"h","yanchor":"top","y":-0.1,"x":0,"tracegroupgap":2,"bgcolor":"rgba(255,255,255,0)"},"margin":{"l":64,"r":64,"t":559,"b":182},"hoverlabel":{"bgcolor":"white","bordercolor":"#e8e4dc"},"height":1421,"plot_bgcolor":"white","paper_bgcolor":"white","hovermode":"x unified","barmode":"relative","bargap":0.12},                        {"responsive": true, "displaylogo": false}                    )                };            </script>        </div>

<script>

    // Kaç sütunlu subplot? xaxis/xaxis2/... domainlerinin sol kenarlarının sayısı.
    var sol = {};
