uraya YALNIZ uzun vadeli bacak girer (A11 ihra\u00e7 54,0, A21 anapara 35,0 mia USD). \u015eekil 12 k\u0131sa\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003evadeyi DE i\u00e7eren A1\u002fA2 toplam\u0131n\u0131 \u00e7izer (55,4 \u002f 38,7 mia USD). Fark bir sapma de\u011fil, kapsam fark\u0131d\u0131r.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eA21 \u0130HRA\u00c7\u002f\u0130TFA OLMAYAN AYDA BO\u015e GEL\u0130R, SIFIR SAYILDI: bu baca\u011f\u0131n 12 ayl\u0131k toplam\u0131 bo\u015f aylar\u0131 s\u0131f\u0131r kabul ederek kurulur \u2014 toplam \u00e7izgisi de\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eayn\u0131 i\u015flemi kullan\u0131r, y\u0131\u011f\u0131n bu y\u00fczden \u00e7izgiye birebir oturur (her ko\u015fuda \u00f6l\u00e7\u00fcl\u00fcr: cikti\u002fyigin_denetimi.json).\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003e\u00dcst paneldeki ihtiya\u00e7 tan\u0131m\u0131 cari FAZLA d\u00f6nemlerinde cari kalemi s\u0131f\u0131rlar (fazla bir ihtiya\u00e7 de\u011fildir); alt paneldeki kimlik s\u00fcr\u00fcm\u00fc fazlay\u0131\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eeksi i\u015faretle ta\u015f\u0131r, bu y\u00fczden iki \u00e7izgi fazla d\u00f6nemlerinde ayr\u0131\u015f\u0131r.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eY\u0131\u011f\u0131lm\u0131\u015f \u00e7ubuklar okunabilirlik i\u00e7in 3 AYDA B\u0130R \u00f6rneklendi (12 ayl\u0131k birikimli seride ard\u0131\u015f\u0131k iki \u00e7ubuk 11 ay\u0131 ortak ta\u015f\u0131r); \u00e7izgiler ayl\u0131k,\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003ehi\u00e7bir tepe noktas\u0131 atlanm\u0131yor.\u003c\u002fsup\u003e","x":0,"xanchor":"left","y":1.0,"yanchor":"top","yref":"container"},"font":{"family":"Georgia, serif","size":12,"color":"#1a1a1a"},"legend":{"font":{"size":11},"orientation":"h","yanchor":"top","y":-0.1,"x":0,"tracegroupgap":2,"bgcolor":"rgba(255,255,255,0)"},"margin":{"l":64,"r":64,"t":637,"b":230},"hoverlabel":{"bgcolor":"white","bordercolor":"#e8e4dc"},"height":1547,"plot_   .plotly-graph-div { width: 100% !important; height: 100vh !important; }

<script>
(function () {
  function genislikSiniri(gd) {
    // Kaç sütunlu subplot? xaxis/xaxis2/... domainlerinin sol kenarlarının sayısı.
    var sol = {};
    Object.keys(gd.layout).forEach(function (k) {
      if (/^xaxis\d*$/.test(k) && gd.layout[k] && gd.layout[k].domain) {
        sol[gd.layout[k].domain[0].toFixed(3)] = 1;
      }
    });
    var sutun = Math.max(1, Object.keys(sol).length);
    // Toplam panel sayısı: kaç ayrı x ekseni var (2x2 ızgara = 4 panel, 2 sütun).
    var panel = Object.keys(gd.layout).filter(function (k) {
      return /^xaxis\d*$/.test(k) && gd.layout[k] && gd.layout[k].domain;
    }).length;
    if (sutun >= 4) return 1220;

    // subplot figürlerinde; tek panelli grafiklerde panel başlığı yoktur).
    var minG = genislikSiniri(gd);
