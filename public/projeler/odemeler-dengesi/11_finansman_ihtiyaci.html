1n\u0131n do\u011frulu\u011fu hakk\u0131nda H\u0130\u00c7B\u0130R \u015eEY s\u00f6ylemez \u2014 bacaklar bozuldu\u011funda da sapma 0,00 \u00e7\u0131k\u0131yor (\u00f6l\u00e7\u00fcld\u00fc).\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eANAPARANIN GER\u00c7EK DENET\u0130M\u0130 BA\u011eIMSIZ B\u0130R KAYNAKLA YAPILIR: uzun vadeli anaparan\u0131n 12 ayl\u0131k toplam\u0131, TCMB'nin HAFTALIK d\u0131\u015f bor\u00e7 \u00f6deme\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003etakviminin 52 haftal\u0131k toplam\u0131na oranlan\u0131r. \u00d6l\u00e7\u00fclen 2,23; bant [1.0, 8.0] (tarih\u00e7e 1,50\u20136,14, n=151). Kapsamlar farkl\u0131 oldu\u011fu i\u00e7in e\u015fitlik\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003ede\u011fil MERTEBE s\u0131nan\u0131r.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eEurobond neden hem ihtiya\u00e7ta hem kaynakta: tahvil bir KRED\u0130 de\u011fil portf\u00f6y y\u00fck\u00fcml\u00fcl\u00fc\u011f\u00fcd\u00fcr; anapara \u00f6demesini ihtiyaca yaz\u0131p ihrac\u0131n\u0131 kayna\u011fa\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eyazmamak tabloyu bir bacak kadar \u015fi\u015firirdi.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eEUROBOND KAPSAMI \u2014 \u015eEK\u0130L 12'DEN FARKLI: buraya YALNIZ uzun vadeli bacak girer (A11 ihra\u00e7 55,7, A21 anapara 29,3 mia USD). \u015eekil 12 k\u0131sa\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003evadeyi DE i\u00e7eren A1\u002fA2 toplam\u0131n\u0131 \u00e7izer (57,9 \u002f 34,7 mia USD). Fark bir sapma de\u011fil, kapsam fark\u0131d\u0131r.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eA21 \u0130HRA\u00c7\u002f\u0130TFA OLMAYAN AYDA BO\u015e GEL\u0130R, SIFIR SAYILDI: bu baca\u011f\u0131n 12 ayl\u0131k toplam\u0131 bo\u015f aylar\u0131 s\u0131f\u0131r kabul ederek kurulur \u2014 toplam \u00e7izgisi de\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eayn\u0131 i\u015flemi kullan\u0131r, y\u0131\u011f\u0131n bu y\u00fczden \u00e7izgiye birebir oturur (her ko\u015fuda \u00f6l\u00e7\u <script>
(function () {
  function genislikSiniri(gd) {
    // Kaç sütunlu subplot? xaxis/xaxis2/... domainlerinin sol kenarlarının sayısı.
    var sol = {};
    Object.keys(gd.layout).forEach(function (k) {
      if (/^xaxis\d*$/.test(k) && gd.layout[k] && gd.layout[k].domain) {
        sol[gd.layout[k].domain[0].toFixed(3)] = 1;
      }

    var sutun = Math.max(1, Object.keys(sol).length);
    // Toplam panel sayısı: kaç ayrı x ekseni var (2x2 ızgara = 4 panel, 2 sütun).
    var panel = Object.keys(gd.layout).filter(function (k) {
      return /^xaxis\d*$/.test(k) && gd.layout[k] && gd.layout[k].domain;
    }).length;
