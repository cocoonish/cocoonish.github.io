l\u0131.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eKalan g\u00fcn say\u0131s\u0131 hafta i\u00e7i g\u00fcnlerdir; resm\u00ee tatiller d\u00fc\u015f\u00fclmedi, \u00e7\u00fcnk\u00fc gelecekteki tatilleri saymak bir varsay\u0131m olurdu. Ge\u00e7mi\u015f 5 y\u0131lda ayn\u0131 takvim\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003epenceresinde ortanca 0 hafta i\u00e7i g\u00fcn g\u00f6zlemsiz kalm\u0131\u015f; o kadar g\u00fcn d\u00fc\u015f\u00fclseydi gereken ortalama 50,166 lira olurdu.\u003c\u002fsup\u003e\u003cbr\u003e\u003csup\u003eGer\u00e7ekle\u015fen kur: TCMB g\u00f6sterge niteli\u011findeki al\u0131\u015f kuru (TP.DK.USD.A.YTL), g\u00fcnl\u00fck.\u003c\u002fsup\u003e","x":0,"xanchor":"left","y":1.0,"yanchor":"top","yref":"container"},"font":{"family":"Georgia, serif","size":12,"color":"#1a1a1a"},"legend":{"font":{"size":11},"orientation":"h","yanchor":"top","y":-0.1,"x":0,"tracegroupgap":2,"bgcolor":"rgba(255,255,255,0)"},"margin":{"l":64,"r":64,"t":325,"b":110},"hoverlabel":{"bgcolor":"white","bordercolor":"#e8e4dc"},"height":1115,"plot_bgcolor":"white","paper_bgcolor":"white","separators":",.","hovermode":"x unified"},                        {"responsive": true, "displaylogo": false}                    )                };            </script>        </div>

<style>

<script>

    var sutun = Math.max(1, Object.keys(sol).length);

    var panel = Object.keys(gd.layout).filter(function (k) {

    var minG = genislikSiniri(gd);
